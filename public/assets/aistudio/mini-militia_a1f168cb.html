<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1114">
<title>Jet Militia</title>
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--ink:#0c1114;--panel:#171e1b;--panel2:#212a26;--line:#3a463f;--khaki:#d8cba0;--mute:#8f9a88;--amber:#f0b429;--red:#e5533d;--green:#7bc47f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input[type=text]{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--khaki);font-family:"Bahnschrift","Arial Narrow","Roboto Condensed",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}

/* touch controls */
#controls{position:fixed;inset:0;pointer-events:none;display:none;z-index:5;--op:.7}
#controls.show{display:block}
.ctl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;opacity:var(--op)}
.stick{border-radius:50%}
.stick .base{position:absolute;inset:11.5%;border-radius:50%;border:2px solid rgba(216,203,160,.6);background:rgba(12,17,20,.35)}
.stick .thumb{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;border-radius:50%;background:rgba(216,203,160,.7);border:2px solid rgba(255,255,255,.45)}
.btn{border-radius:50%;border:2px solid rgba(216,203,160,.65);background:rgba(12,17,20,.5);color:var(--khaki);font-weight:700;font-size:12px;padding:0}
.btn.on{background:rgba(240,180,41,.65);color:#111}
#controls.editing .ctl{outline:2px dashed var(--amber);outline-offset:-2px;cursor:move;opacity:1}
#controls.editing .ctl::after{content:attr(data-label);position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:11px;color:var(--amber);white-space:nowrap;pointer-events:none}
#pauseBtn{position:fixed;top:10px;right:12px;z-index:6;width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:rgba(12,17,20,.6);display:none;font-size:14px;letter-spacing:-2px}

/* screens */
.screen{position:fixed;inset:0;display:none;z-index:10;align-items:center;justify-content:center;background:rgba(8,11,13,.78);padding:10px}
.screen.show{display:flex}
.panel{width:min(940px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.brand b{font:400 28px/1 Impact,"Haettenschweiler","Arial Black",sans-serif;letter-spacing:2px;color:var(--amber)}
.brand span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.callsign{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.callsign input{width:150px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:#0e1412;color:var(--khaki);font:700 15px inherit;outline:none}
.callsign input:focus{border-color:var(--amber)}
#tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;touch-action:pan-x}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-size:15px;color:var(--mute);white-space:nowrap}
#tabs button.on{color:var(--khaki);border-bottom-color:var(--amber)}
#tabBody{flex:1;overflow-y:auto;padding:14px 16px;touch-action:pan-y;min-height:120px}
.panel footer{display:flex;gap:10px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel2)}
.cta{background:var(--amber);color:#171100;border:0;border-radius:6px;padding:11px 28px;font-weight:800;font-size:16px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 16px;font-size:14px}
.ghost:hover{border-color:var(--khaki)}
h3{margin:14px 0 8px;font-size:14px;font-weight:700;color:var(--amber)}
h3:first-child{margin-top:0}
p{margin:4px 0;font-size:14px;line-height:1.45}
.mute{color:var(--mute)}
.big{font-size:22px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel2)}
.card.wide{grid-column:1/-1}
.how{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.split{display:grid;grid-template-columns:230px 1fr;gap:16px}
.pvwrap{border:1px solid var(--line);border-radius:8px;background:radial-gradient(circle at 50% 40%,#2c3a35,#10161a);display:flex;align-items:center;justify-content:center;align-self:start;position:sticky;top:0}
.pvwrap canvas{width:100%;height:auto;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(58,70,63,.5);font-size:14px}
.row small{display:block;color:var(--mute);font-size:12px}
.row input[type=range]{flex:0 1 220px;accent-color:var(--amber);touch-action:pan-y}
.row output{min-width:38px;text-align:right;color:var(--amber);font-weight:700}
.sw{width:22px;height:22px;accent-color:var(--amber)}
.seg{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.seg button{background:#0e1412;border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px}
.seg button.on{background:var(--amber);color:#171100;border-color:var(--amber);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;background:#0e1412;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.chip i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.chip.on{border-color:var(--amber);color:#fff}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.colors input{width:56px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.flames{display:flex;gap:8px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.dot.on{border-color:#fff}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wcard{text-align:left;background:#0e1412;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.wcard.on{border-color:var(--amber);background:#1d2518}
.wcard b{display:block;font-size:14px}
.wcard small{color:var(--mute);font-size:11px}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:4px}
.bar span{width:44px}
.bar div{flex:1;height:5px;background:#27322d;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
.group{margin-bottom:6px}
#editbar{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:12;display:none;gap:8px;align-items:center;background:rgba(12,17,20,.9);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-size:13px}
#editbar.show{display:flex}
#pause .panel,#over .panel{width:min(420px,100%)}
#pause .body,#over .body{padding:18px;display:flex;flex-direction:column;gap:10px}
#pause .body button,#over .body button{padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:16px;font-weight:700}
#pause .body button.primary,#over .body button.primary{background:var(--amber);color:#171100;border-color:var(--amber)}
.res{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:15px}
.res .me{color:var(--amber);font-weight:800}
#rotate{position:fixed;inset:0;z-index:20;background:var(--ink);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px}
@media (orientation:portrait){body.playing #rotate{display:flex}}
@media (max-height:480px){
  .panel header{padding:6px 12px}.brand b{font-size:22px}.brand span{display:none}
  #tabs button{padding:7px 12px;font-size:14px}#tabBody{padding:10px 12px}.panel footer{padding:7px 12px}.cta{padding:9px 22px}
  .split{grid-template-columns:150px 1fr}
}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.split{grid-template-columns:1fr}.pvwrap{position:static;max-width:200px;margin:auto}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="controls">
  <div class="ctl stick" id="cStick" data-id="stick" data-label="Move / fly"><div class="base"></div><div class="thumb"></div></div>
  <div class="ctl stick" id="cAim" data-id="aim" data-label="Aim / fire"><div class="base"></div><div class="thumb"></div></div>
  <button class="ctl btn" id="cReload" data-id="reload" data-label="Reload">Reload</button>
  <button class="ctl btn" id="cSwap" data-id="swap" data-label="Swap gun">Swap</button>
  <button class="ctl btn" id="cNade" data-id="nade" data-label="Grenade">Nade</button>
</div>
<button id="pauseBtn" aria-label="Pause">❚❚</button>

<div id="menu" class="screen show">
  <div class="panel">
    <header>
      <div class="brand"><b>JET MILITIA</b><span>Jetpack deathmatch against bots</span></div>
      <label class="callsign">Name <input id="nameIn" type="text" maxlength="14" autocomplete="off" spellcheck="false"></label>
    </header>
    <nav id="tabs">
      <button data-tab="play">Play</button>
      <button data-tab="character">Character</button>
      <button data-tab="weapons">Weapons</button>
      <button data-tab="controls">Controls</button>
      <button data-tab="match">Match</button>
      <button data-tab="lan">LAN</button>
    </nav>
    <section id="tabBody"></section>
    <footer>
      <button class="ghost" id="fsBtn">Fullscreen</button>
      <button class="cta" id="deploy">Deploy</button>
    </footer>
  </div>
</div>

<div id="pause" class="screen">
  <div class="panel">
    <header><div class="brand"><b>PAUSED</b></div></header>
    <div class="body">
      <button class="primary" id="resumeBtn">Resume</button>
      <button id="pSettings">Loadout and settings</button>
      <button id="pFs">Fullscreen</button>
      <button id="quitBtn">Quit to menu</button>
    </div>
  </div>
</div>

<div id="over" class="screen">
  <div class="panel">
    <header><div class="brand"><b id="overTitle">MATCH OVER</b></div></header>
    <div class="body">
      <div class="res" id="overRes"></div>
      <button class="primary" id="rematchBtn">Rematch</button>
      <button id="overMenu">Back to menu</button>
    </div>
  </div>
</div>

<div id="editbar"><span>Drag any control to move it</span><button class="ghost" id="editReset">Reset</button><button class="cta" id="editDone" style="padding:8px 18px;font-size:14px">Done</button></div>
<div id="rotate"><div>Rotate your phone to landscape to play.</div></div>

<script>
/* ================= GameKit: fullscreen + comfort layer + cheat menu =================
   Triple tap / triple click anywhere on the screen -> password prompt (313) -> cheat menu.
   The menu can be minimised to a small pill, dragged, closed, and re-opened with another triple tap. */
(function(){
'use strict';
const PASS='313',K=window.GameKit={C:{},_items:{},_cfg:null,unlocked:false};
const $=(s,r)=> (r||document).querySelector(s);
const h=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const coarse=()=>matchMedia('(pointer:coarse)').matches;
let opts={id:'game',title:'Game',accent:'#ffb020',fsPos:{top:'10px',right:'10px'},ignore:''};

/* ---------- styles ---------- */
const css=`
.gk-ui,.gk-ui *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{overscroll-behavior:none}
#gk-fs{position:fixed;z-index:2147482000;width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(10,14,24,.62);color:#fff;font-size:19px;line-height:1;padding:0;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(3px)}
#gk-fs:hover{background:rgba(40,50,80,.85)}#gk-fs:active{transform:scale(.94)}
.gk-toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:2147483600;background:rgba(10,14,24,.94);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:9px 14px;font-size:13px;max-width:88vw;text-align:center;pointer-events:none;transition:.22s}
.gk-toast.on{opacity:1;transform:translate(-50%,0)}
.gk-veil{position:fixed;inset:0;z-index:2147483300;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px}
.gk-pw{width:min(290px,94vw);background:#10172a;color:#eef2ff;border:1px solid var(--gk-a);border-radius:14px;padding:14px;box-shadow:0 12px 40px #000a}
.gk-pw b{display:block;font-size:15px;margin-bottom:2px}.gk-pw small{display:block;color:#98a4c8;font-size:12px;margin-bottom:10px}
.gk-pw input{width:100%;background:#070b17;color:#fff;border:2px solid #2c3a66;border-radius:10px;padding:10px 12px;font-size:20px;letter-spacing:.4em;text-align:center;outline:none;-webkit-text-security:disc;user-select:text;-webkit-user-select:text;touch-action:auto}
.gk-pw input:focus{border-color:var(--gk-a)}
.gk-pw.bad{animation:gk-shake .3s}.gk-pw.bad input{border-color:#ef4057}
@keyframes gk-shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.gk-row2{display:flex;gap:8px;margin-top:10px}
.gk-b{flex:1;border:0;border-radius:9px;padding:9px 10px;font-weight:700;font-size:13px;cursor:pointer;background:#27345f;color:#fff}
.gk-b.pri{background:var(--gk-a);color:#161000}.gk-b:active{filter:brightness(1.25)}.gk-b.on{background:var(--gk-a);color:#161000}
.gk-panel{position:fixed;z-index:2147483200;width:232px;max-width:calc(100vw - 12px);max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);display:flex;flex-direction:column;background:rgba(12,18,34,.94);color:#eef2ff;border:1px solid var(--gk-a);border-radius:13px;box-shadow:0 10px 34px #000b;font-size:13px;overflow:hidden}
.gk-hd{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 10px;background:linear-gradient(90deg,var(--gk-a),transparent 260%);color:#120d00;font-weight:800;cursor:grab;touch-action:none}
.gk-hd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.gk-ib{width:28px;height:28px;border:0;border-radius:8px;background:rgba(0,0,0,.28);color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0}
.gk-ib:active{background:rgba(0,0,0,.55)}
.gk-bd{overflow-y:auto;padding:4px 8px 8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.gk-g>h4{margin:8px 0 3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gk-a);display:flex;justify-content:space-between;cursor:pointer;font-weight:800}
.gk-g.shut>.gk-gb{display:none}
.gk-it{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;padding:2px 2px}
.gk-it>span{flex:1;min-width:0;line-height:1.2}
.gk-sw{position:relative;width:38px;height:22px;border-radius:999px;background:#2b3558;border:0;padding:0;flex:none;cursor:pointer;transition:.15s}
.gk-sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.gk-sw.on{background:var(--gk-a)}.gk-sw.on::after{left:18px;background:#161000}
.gk-rg{padding:3px 2px 5px}.gk-rg>div{display:flex;justify-content:space-between}.gk-rg output{color:var(--gk-a);font-weight:700}
.gk-rg input{width:100%;height:26px;accent-color:var(--gk-a);touch-action:pan-y;margin:0}
.gk-bt{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:3px 0}
.gk-bt .gk-b{padding:8px 4px;font-size:12px}
.gk-note{color:#98a4c8;font-size:11.5px;line-height:1.35;padding:2px}
.gk-ft{display:flex;gap:6px;padding:6px 8px 8px;border-top:1px solid #26335c}
.gk-pill{position:fixed;z-index:2147483200;display:flex;align-items:center;gap:5px;padding:4px 5px 4px 8px;background:rgba(12,18,34,.94);border:1px solid var(--gk-a);border-radius:999px;color:#fff;box-shadow:0 6px 20px #000a;touch-action:none;cursor:grab;max-width:calc(100vw - 8px)}
.gk-pill>b{font-size:11px;letter-spacing:.06em;color:var(--gk-a)}
.gk-chip{border:0;border-radius:999px;background:#27345f;color:#dfe6ff;font-size:11px;font-weight:700;padding:5px 8px;cursor:pointer;white-space:nowrap}
.gk-chip.on{background:var(--gk-a);color:#161000}
.gk-pill .gk-ib{width:26px;height:26px;border-radius:50%;background:#27345f}
@media (max-height:430px){.gk-panel{width:214px}.gk-it{min-height:28px}}
`;

/* ---------- toast ---------- */
let tt=0,toastEl=null;
K.toast=function(msg,ms){if(!toastEl){toastEl=h('div','gk-toast gk-ui');document.body.appendChild(toastEl);}toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),ms||2400);};

/* ---------- fullscreen ---------- */
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
K.isFullscreen=isFs;
K.fullscreen=async function(){
  const el=document.documentElement;
  try{
    if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch(e){}return;}
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!req){K.toast('Fullscreen is not available in this browser. On iPhone use Share, then Add to Home Screen.',3600);return;}
    await req.call(el,{navigationUI:'hide'});
    if(coarse()&&opts.landscape!==false){try{await screen.orientation.lock('landscape');}catch(e){}}
  }catch(e){K.toast('The browser blocked fullscreen. Tap the button again.');}
};
function syncFs(){const b=$('#gk-fs');if(!b)return;b.textContent=isFs()?'\u2715':'\u26F6';b.title=isFs()?'Exit fullscreen':'Fullscreen';b.setAttribute('aria-label',b.title);}

/* ---------- wake lock (keeps the screen on while playing) ---------- */
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){}}

/* ---------- cheat state ---------- */
K.get=id=>K.C[id];
K.on=id=>!!K.C[id];
K.set=function(id,v,silent){
  const it=K._items[id];if(!it)return;
  K.C[id]=v;if(it.on&&!silent){try{it.on(v);}catch(e){console.error(e);}}
  render();
};
K.reset=function(){for(const id in K._items){const it=K._items[id];if(it.type==='button')continue;K.C[id]=it.def!=null?it.def:(it.type==='toggle'?false:0);if(it.on){try{it.on(K.C[id]);}catch(e){}}}render();};
K.cheats=function(cfg){
  K._cfg=cfg;K._items={};
  for(const g of cfg.groups)for(const it of g.items){
    if(it.type==='buttons'){for(const b of it.items){if(b.id)K._items[b.id]={type:'button',run:b.run};}continue;}
    if(!it.id)continue;K._items[it.id]=it;
    if(it.type!=='button')K.C[it.id]=it.def!=null?it.def:(it.type==='toggle'?false:0);
  }
};

/* ---------- UI: panel / pill ---------- */
let panel=null,pill=null,mode='closed',pos={x:10,y:56},pillPos=null,shut={};
function clampPos(p,w,hh){return{x:Math.max(4,Math.min(innerWidth-w-4,p.x)),y:Math.max(4,Math.min(innerHeight-hh-4,p.y))};}
function drag(handle,el,get,set){
  let id=null,ox=0,oy=0,moved=false;
  handle.addEventListener('pointerdown',e=>{if(e.target.closest('button')&&!e.target.classList.contains('gk-pillgrab'))return;id=e.pointerId;moved=false;const r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;try{handle.setPointerCapture(id);}catch(_){}e.stopPropagation();});
  handle.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;moved=true;const r=el.getBoundingClientRect(),p=clampPos({x:e.clientX-ox,y:e.clientY-oy},r.width,r.height);el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.right='auto';el.style.bottom='auto';set(p);});
  const end=e=>{if(e.pointerId===id)id=null;};
  handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);
}
function itemVisible(it){return !it.show||it.show();}
function render(){
  if(mode==='closed'){if(panel){panel.remove();panel=null;}if(pill){pill.remove();pill=null;}return;}
  document.documentElement.style.setProperty('--gk-a',opts.accent);
  if(mode==='min'){
    if(panel){panel.remove();panel=null;}
    if(!pill){pill=h('div','gk-pill gk-ui');document.body.appendChild(pill);drag(pill,pill,()=>pillPos,p=>{pillPos=p;});}

    else{box.classList.remove('bad');void box.offsetWidth;box.classList.add('bad');inp.value='';inp.focus();}
  };
  ok.onclick=submit;no.onclick=done;

/* ---------- triple tap detector ---------- */
const taps=[];
function onTap(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const t=e.target;
  if(t&&t.closest&&t.closest('.gk-ui,button,a,input,select,textarea,label,summary,[data-gk-ignore]'+(opts.ignore?','+opts.ignore:'')))return;
  const now=performance.now();
  while(taps.length&&now-taps[0].t>850)taps.shift();
  if(taps.length&&Math.hypot(taps[taps.length-1].x-e.clientX,taps[taps.length-1].y-e.clientY)>80)taps.length=0;
  taps.push({t:now,x:e.clientX,y:e.clientY});
  if(taps.length>=3){
    taps.length=0;
    if(!K._cfg)return;
    if(K.unlocked){if(mode==='closed')K.open();else if(mode==='min'){mode='open';render();}else K.close();}
    else askPassword();
  }
}

};

<script>
/* ================= LAN transport =================
   Same API as the one in Supreme Duelist, so every game in the pack talks to the same server.js.
   WebSocket (node server.js, works across devices) with a BroadcastChannel fallback (tabs of one browser). */
class WSNet{
 constructor(game){this.game=game;this.ws=null;this.id='';this.pend=null;this.label='Local network server';}
 open(){return new Promise((res,rej)=>{
  let ok=false,w;
  try{w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');}catch(e){return rej(e);}
  w.onopen=()=>{ok=true;this.ws=w;res(this);};
  w.onerror=()=>{if(!ok)rej(new Error('no server'));};
  w.onclose=()=>{this.ws=null;if(ok&&this.onclose)this.onclose();};
  w.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}this.on(m);};
  setTimeout(()=>{if(!ok){rej(new Error('timeout'));try{w.close();}catch(_){}}},2500);});}
 tx(o){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(o));}
 req(o,okOp){return new Promise((res,rej)=>{const p={okOp,res,rej};this.pend=p;this.tx(o);setTimeout(()=>{if(this.pend===p){this.pend=null;rej(new Error('Timed out'));}},4000);});}
 on(m){
  const p=this.pend;
  if(p&&(m.op===p.okOp||m.op==='err')){this.pend=null;return m.op==='err'?p.rej(new Error(m.msg)):p.res(m);}
  if(m.op==='msg'&&this.onmsg)this.onmsg(m.from,m.data);
  else if(m.op==='peer'&&this.onpeer)this.onpeer(m.id,m.name);
  else if(m.op==='left'&&this.onleft)this.onleft(m.id);
  else if(m.op==='hostgone'&&this.onhostgone)this.onhostgone();
 }
 async hostRoom(info){const m=await this.req({op:'host',info},'hosted');return m.code;}
 setInfo(info){this.tx({op:'info',info});}
 async listRooms(){const m=await this.req({op:'rooms',game:this.game},'rooms');return m.list;}
 async joinRoom(code,name){const m=await this.req({op:'join',code,name},'joined');this.id=m.id;return m.id;}
 send(to,data){this.tx({op:'send',to,data});}
 close(){const w=this.ws;this.ws=null;this.onclose=null;try{w&&w.close();}catch(_){}}
}
class BCNet{
 constructor(game){this.id='b'+Math.random().toString(36).slice(2,9);this.bc=new BroadcastChannel('lan-pack-'+game);this.code='';this.hosting=false;this.info=null;this.joined='';this.hostId='';this.label='This browser only (tabs)';this.bc.onmessage=e=>this.on(e.data);}
 async open(){return this;}
 tx(o){o.from=this.id;this.bc.postMessage(o);}
 on(m){
  if(!m||m.from===this.id)return;
  const mine=this.hosting?this.code:this.joined;
  if(m.t==='who'&&this.hosting)this.tx({t:'room',code:this.code,info:this.info,to:m.from});
  else if(m.t==='room'&&m.to===this.id&&this.collect)this.collect.push(Object.assign({code:m.code},m.info));
  else if(m.t==='join'&&this.hosting&&m.code===this.code){this.tx({t:'joined',to:m.from,code:this.code});if(this.onpeer)this.onpeer(m.from,m.name);}
  else if(m.t==='joined'&&m.to===this.id&&this.jr){this.hostId=m.from;const r=this.jr;this.jr=null;r(this.id);}
  else if(m.t==='data'&&m.code===mine&&(m.to===this.id||m.to==='*')){if(this.onmsg)this.onmsg(this.hosting?m.from:'host',m.data);}
  else if(m.t==='leave'&&this.hosting&&m.code===this.code){if(this.onleft)this.onleft(m.from);}
  else if(m.t==='hostgone'&&this.joined&&m.code===this.joined){if(this.onhostgone)this.onhostgone();}
 }
 async hostRoom(info){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';this.code=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');this.hosting=true;this.info=info;return this.code;}
 setInfo(info){this.info=info;}
 listRooms(){return new Promise(res=>{this.collect=[];this.tx({t:'who'});setTimeout(()=>{const l=this.collect;this.collect=null;res(l);},500);});}
 joinRoom(code,name){return new Promise((res,rej)=>{this.joined=code;this.jr=res;this.tx({t:'join',code,name});setTimeout(()=>{if(this.jr){this.jr=null;this.joined='';rej(new Error('Room '+code+' was not found'));}},1200);});}
 send(to,data){this.tx({t:'data',code:this.hosting?this.code:this.joined,to:to==='host'?this.hostId:to,data});}
 close(){if(this.hosting)this.tx({t:'hostgone',code:this.code});else if(this.joined)this.tx({t:'leave',code:this.joined});this.hosting=false;this.joined='';this.code='';try{this.bc.close();}catch(_){}}
}
async function openLan(game){
 let n=null;
 if(location.protocol.indexOf('http')===0){try{n=await new WSNet(game).open();}catch(e){n=null;}}
 if(!n){if(typeof BroadcastChannel==='undefined')throw new Error('Networking is not available in this browser');n=new BCNet(game);}
 return n;
}

function noise(dur,g,v,lp){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=lp;gn.gain.setValueAtTime(Math.max(.001,g*v*S.vol),t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(t);s.stop(t+Math.min(dur,.95)+.02)}
function sfx(k,v=1){
 if(!AC||v<=.03||S.vol<=0)return;const n=AC.currentTime;if(lastSfx[k]&&n-lastSfx[k]<.03)return;lastSfx[k]=n;
 switch(k){
  case'pistol':tone(520,120,.12,'square',.25,v);noise(.08,.25,v,5000);break;
  case'smg':tone(420,110,.07,'square',.18,v);noise(.05,.2,v,6000);break;
  case'rifle':tone(300,70,.1,'sawtooth',.22,v);noise(.08,.3,v,4500);break;
  case'shotgun':noise(.35,.7,v,2500);tone(160,40,.25,'sawtooth',.4,v);break;
  case'sniper':noise(.5,.7,v,6000);tone(900,60,.3,'sawtooth',.35,v);break;
  case'rocket':noise(.5,.4,v,1500);tone(200,60,.4,'sawtooth',.3,v);break;
  case'boom':noise(.8,.9,v,900);tone(90,30,.6,'sine',.7,v);break;
  case'hit':tone(900,500,.06,'triangle',.25,v);break;
  case'hurt':tone(220,90,.15,'sawtooth',.3,v);break;
  case'click':tone(1400,900,.04,'square',.12,v);break;
  case'reload':tone(300,200,.06,'square',.12,v);setTimeout(()=>{if(AC)tone(500,700,.06,'square',.12,v)},160);break;

  burst(e.x,e.y,22,'#c0392b',260,.9,600,3);burst(e.x,e.y,10,e.skin.suit,220,.9,600,3);

function explode(x,y,R,dmg,owner,label){

function updBullets(dt){
 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];b.life-=dt;
  if(b.life<=0){if(b.explosive)explode(b.x,b.y,b.radius,b.dmg,b.owner,b.gun);bullets.splice(i,1);continue}
  const mvx=b.vx*dt,mvy=b.vy*dt,n=Math.max(1,Math.ceil(Math.hypot(mvx,mvy)/5)),sx=mvx/n,sy=mvy/n;
  b.px=b.x;b.py=b.y;let dead=false;
  for(let s=0;s<n&&!dead;s++){
   b.x+=sx;b.y+=sy;
   if(solidAt(b.x,b.y)){burst(b.x,b.y,4,'#ffd36a',140,.2,300,2);if(b.explosive)explode(b.x-sx,b.y-sy,b.radius,b.dmg,b.owner,b.gun);dead=true;break}
   for(const e of ents){
    if(e===b.owner||e.dead||e.inv>0||(b.hit&&b.hit.has(e)))continue;
    if(Math.abs(b.x-e.x)<e.w/2+2&&Math.abs(b.y-e.y)<e.h/2+2){
     if(b.explosive){explode(b.x,b.y,b.radius,b.dmg,b.owner,b.gun);dead=true;break}
     const head=b.y<e.y-9;hurt(e,b.dmg*(head?1.6:1),b.owner,b.gun,head);
     if(b.pierce){(b.hit||(b.hit=new Set())).add(e)}else{dead=true;break}
    }
   }
  }
  if(b.explosive&&!dead&&Math.random()<.8)parts.push({x:b.x,y:b.y,vx:rnd(-20,20),vy:rnd(-20,20),life:.5,max:.5,col:'#777',grav:-20,size:3});
  if(dead)bullets.splice(i,1);
 }
}
function updNades(dt){
 for(let i=nades.length-1;i>=0;i--){
  const g=nades[i];g.t-=dt;g.vy+=900*dt;
  g.x+=g.vx*dt;if(solidAt(g.x,g.y)){g.x-=g.vx*dt;g.vx*=-.55}
  g.y+=g.vy*dt;if(solidAt(g.x,g.y)){g.y-=g.vy*dt;g.vy*=-.45;g.vx*=.85;if(Math.abs(g.vy)<30)g.vy=0}
  if(g.t<=0){explode(g.x,g.y,120,85,g.owner,'Grenade');nades.splice(i,1)}
 }
}

/* ============ input ============ */
function dz(x,y){const m=Math.hypot(x,y),d=S.ctl.dead;if(m<d||m===0)return[0,0,0];const mm=Math.min(1,m),k=(mm-d)/(1-d)/m;return[x*k,y*k,mm]}
function assist(aimT,k){
 let best=null,bd=1e9;
 for(const e of ents){if(e===P||e.dead)continue;const d=Math.hypot(e.x-P.x,e.y-P.y);if(d>750||d>=bd)continue;const a=Math.atan2(e.y-(P.y-3),e.x-P.x);if(Math.abs(wrap(a-aimT))<.35&&los(P.x,P.y-6,e.x,e.y-6)){best={a};bd=d}}
 if(!best)return aimT;const diff=wrap(best.a-aimT);return aimT+diff*k*.7*(1-Math.abs(diff)/.35);
}
let prevPad=[];
function pad(){const gps=navigator.getGamepads?navigator.getGamepads():[];for(const g of gps)if(g&&g.connected)return g;return null}
function readInput(){
 const c=S.ctl,inp={mx:0,jet:false,fire:false,hasAim:false,aimT:P?P.aim:0,aimK:14*c.aim,reload:pulse.reload,swap:pulse.swap,nade:pulse.nade};
 pulse.reload=pulse.swap=pulse.nade=false;if(!P)return inp;
 const kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 if(kx)inp.mx=kx;if(keys.KeyW||keys.ArrowUp||keys.Space)inp.jet=true;
 let stickAim=false;
 if(mouse.active){const{sc}=view(),wx=mouse.x/sc+cam.x,wy=mouse.y/sc+cam.y;inp.aimT=Math.atan2(wy-(P.y-3),wx-P.x);inp.hasAim=true;inp.aimK=18*c.aim;if(mouse.down)inp.fire=true}
 if(stickL.id!==null){const[x,y]=dz(stickL.x,stickL.y);inp.mx=clamp(x*c.move,-1,1);if(-y*c.move>.5)inp.jet=true}
 if(stickR.id!==null){const[x,y,m]=dz(stickR.x,stickR.y);if(m>0){inp.aimT=Math.atan2(y,x);inp.hasAim=true;inp.aimK=14*c.aim;stickAim=true;inp.fire=c.autofire?m>.12:m>=c.fireAt}}
 const g=pad();
 if(g){
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=g.axes;
  const[lx,ly]=dz(ax[0]||0,ax[1]||0);
  if(lx||ly){inp.mx=clamp(lx*c.move,-1,1);if(-ly*c.move>.5)inp.jet=true}
  if(b(14))inp.mx=-1;if(b(15))inp.mx=1;if(b(12)||b(0)||b(6))inp.jet=true;
  const[rx,ry,m]=dz(ax[2]||0,ax[3]||0);
  if(m>0){inp.aimT=Math.atan2(ry,rx);inp.hasAim=true;inp.aimK=14*c.aim;stickAim=true;if(c.autofire?m>.12:m>=c.fireAt)inp.fire=true}
  if(b(7)||b(5))inp.fire=true;
  const edge=i=>b(i)&&!prevPad[i];
  if(edge(2))inp.reload=true;if(edge(3))inp.swap=true;if(edge(4))inp.nade=true;
  if(edge(9)&&(state==='play'||state==='paused'))togglePause();
  prevPad=g.buttons.map(x=>x.pressed);
 }
 if(stickAim&&c.assist>0)inp.aimT=assist(inp.aimT,c.assist);

}
function botInput(b,dt){
 const D=DIFF[S.match.diff]||DIFF.normal;
 const inp={mx:0,jet:false,fire:false,hasAim:true,aimT:b.aim,aimK:D.aimK,reload:false,swap:false,nade:false};
 b.thinkT-=dt;b.strafeT-=dt;b.wpT-=dt;
 if(b.thinkT<=0){
  b.thinkT=rnd(.15,.3);let best=null,bd=1e9;
  for(const e of ents){if(e===b||e.dead)continue;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<D.sight&&d<bd&&los(b.x,b.y-6,e.x,e.y-6)){best=e;bd=d}}
  b.target=best;
  if(!best&&(!b.way||Math.hypot(b.way.x-b.x,b.way.y-b.y)<70||b.wpT<=0)){b.way=pick(SPAWNS);b.wpT=rnd(6,12)}
 }
 if(b.strafeT<=0){b.strafeT=rnd(.8,2);b.strafe=Math.random()<.5?-1:1}
 const t=b.target,g=b.guns[b.cur];let wantY=b.y;
 if(t&&!t.dead){
  const dx=t.x-b.x,dy=t.y-b.y,d=Math.hypot(dx,dy),pref=g.d.pref;
  if(d>pref+70)inp.mx=Math.sign(dx);else if(d<pref-90)inp.mx=-Math.sign(dx);else inp.mx=b.strafe*.6;
  wantY=t.y;
  b.err=clamp(b.err+(Math.random()-.5)*dt*2,-D.err,D.err);
  const tv=d/g.d.speed,lx=t.x+t.vx*tv*D.lead,ly=t.y+t.vy*tv*D.lead;
  const ang=Math.atan2(ly-(b.y-3),lx-b.x)+b.err;
  inp.aimT=ang;
  const maxR=Math.min(900,g.d.speed*g.d.life*.8);
  if(Math.abs(wrap(ang-b.aim))<.15&&d<maxR&&Math.random()<D.fire)inp.fire=true;
  if(b.nades>0&&b.nadeCd<=0&&d>140&&d<420&&Math.random()<.004)inp.nade=true;
  if(g.ammo===0&&b.guns[b.cur^1].ammo>0)inp.swap=true;
 }else if(b.way){
  const dx=b.way.x-b.x;if(Math.abs(dx)>25)inp.mx=Math.sign(dx);wantY=b.way.y;
  inp.aimT=inp.mx>=0?0:Math.PI;if(g.ammo<g.mag)inp.reload=true;
 }
 if(inp.mx!==0&&Math.abs(b.vx)<30)b.stuck+=dt;else b.stuck=Math.max(0,b.stuck-dt);
 if(b.fuel<6)b.jetLock=true;if(b.fuel>45)b.jetLock=false;
 inp.jet=(wantY<b.y-50||b.stuck>.35)&&!b.jetLock;
 if(inp.jet&&Math.abs(b.vy)<40&&!b.onGround)b.blockT+=dt;else b.blockT=0;
 if(b.blockT>.3)inp.mx=b.strafe;
 return inp;
}

/* ============ simulation ============ */
function moveEntity(e,dt){
 const hw=e.w/2,hh=e.h/2;
 e.x+=e.vx*dt;

 for(const r of PL){if(e.x+hw>r.x+.01&&e.x-hw<r.x+r.w-.01&&e.y+hh>r.y&&e.y-hh<r.y+r.h){if(e.vy>0){e.y=r.y-hh;e.onGround=true}else if(e.vy<0){e.y=r.y+r.h+hh}e.vy=0}}

 else if(Math.abs(inp.mx)>.3&&Math.sign(inp.mx)!==(Math.cos(e.aim)>=0?1:-1))e.aim=wrap(Math.PI-e.aim);
 e.nadeCd=Math.max(0,e.nadeCd-dt);e.swapCd=Math.max(0,e.swapCd-dt);e.flashT=Math.max(0,e.flashT-dt);
 for(const g of e.guns){g.cd=Math.max(0,g.cd-dt);if(g.rt>0){g.rt-=dt;if(g.rt<=0){g.ammo=g.mag;g.rt=0}}}
 if(inp.swap&&e.swapCd<=0){e.cur^=1;e.swapCd=.3;if(e===P)sfx('click',1)}
 const g=e.guns[e.cur];
 if(inp.reload&&g.rt<=0&&g.ammo<g.mag){g.rt=g.d.reload;if(e===P)sfx('reload',1)}
 if(inp.fire&&g.rt<=0&&g.cd<=0){if(g.ammo>0)shoot(e);else{g.rt=g.d.reload;if(e===P)sfx('reload',1)}}
 if(inp.nade)throwNade(e);

 else{e.regen-=dt;if(e.regen<=0)e.fuel=Math.min(100,e.fuel+(e.onGround?55:16)*dt)}

 applyCheatsPre(inp);
 for(const e of ents){
  if(e.dead){e.respawn-=dt;if(e.respawn<=0)spawnEnt(e);continue}
  e.inv=Math.max(0,e.inv-dt);
  actuate(e,e===P?inp:(e.remote?remoteInp(e):(K.on('freeze')?neutralInp():botInput(e,dt))),dt);
 }
 applyCheatsPost();
 updBullets(dt);updNades(dt);
 for(const p of packs){

  for(const e of ents){if(!e.dead&&e.hp<100&&Math.abs(e.x-p.x)<22&&Math.abs(e.y-p.y)<30){e.hp=Math.min(100,e.hp+50);p.t=15;if(e===P)sfx('pickup',1);if(NETM.role==='host')evq.push(['pk',ents.indexOf(e)]);break}}
 }
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
 for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>=rings[i].dur)rings.splice(i,1)}
 for(let i=feed.length-1;i>=0;i--){feed[i].t-=dt;if(feed[i].t<=0)feed.splice(i,1)}
 flash=Math.max(0,flash-dt);hitT=Math.max(0,hitT-dt);cam.shake=Math.max(0,cam.shake-dt*20);

}

/* ============ frame loop ============ */
let last=performance.now();
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min(.033,(t-last)/1000||.016);last=t;
 fpsAcc+=dt;fpsN++;if(fpsAcc>.5){fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0}
 if(NETM.role==='client'&&(state==='play'||state==='paused'))clientUpdate(dt);
 else if(state==='play'||(state==='paused'&&NETM.role==='host'))update(dt);
 else if(state==='paused'||state==='over'){if(P)updCamera(dt)}
 else{
  idleT+=dt;const{vw,vh}=view();
  cam.x=clamp((Math.sin(idleT*.08)*.5+.5)*(WORLD_W-vw),0,Math.max(0,WORLD_W-vw));cam.y=Math.max(0,WORLD_H-vh-60);
  if(state==='menu'||state==='pmenu'){parts.length=0}
 }
 render();drawPreview();
}

/* ----- host ----- */
async function lanHost(){
 if(NETM.busy)return;NETM.busy=true;
 try{
  const net=await openLan('militia');
  const code=await net.hostRoom({game:'militia',name:S.name||'Rookie',open:7,inGame:false});
  NETM.net=net;NETM.role='host';NETM.code=code;NETM.label=net.label;NETM.peers=new Map();NETM.view='lobby';
  net.onpeer=(id,name)=>{if(NETM.peers.size>=7){netSend(id,{t:'full'});return}NETM.peers.set(id,{id,name:String(name||'Guest').slice(0,14),cfg:null,ent:null});toastM((name||'Guest')+' joined');lobbyBroadcast()};
  net.onleft=id=>{const p=NETM.peers.get(id);if(!p)return;NETM.peers.delete(id);if(p.ent){p.ent.remote=false}toastM(p.name+' left');lobbyBroadcast()};
  net.onmsg=hostMsg;net.onclose=()=>{toastM('Network connection lost');lanLeave()};
  lobbyBroadcast();
 }catch(e){toastM(e.message||'Could not host')}
 NETM.busy=false;syncUI();
}
function lobbyBroadcast(){
 if(NETM.role!=='host')return;
 const list=[{name:S.name||'Rookie',host:true}].concat([...NETM.peers.values()].map(p=>({name:p.name})));
 NETM.lobby={code:NETM.code,list,inGame:matchOn()};
 netSend('*',Object.assign({t:'lobby'},NETM.lobby));
 NETM.net.setInfo({game:'militia',name:S.name||'Rookie',open:Math.max(0,8-list.length),inGame:matchOn()});
 if(state==='menu'||state==='pmenu')renderTab();
}
function hostMsg(from,d){
 const p=NETM.peers.get(from);if(!p||!d)return;
 if(d.t==='hello'){p.name=String(d.name||p.name).slice(0,14);p.cfg=cleanCfg(d.cfg);lobbyBroadcast()}
 else if(d.t==='in'&&p.ent){const e=p.ent;if(!e.rin)e.proc={r:d.r|0,s:d.s|0,n:d.n|0};
  e.rin={mx:clamp(+d.mx||0,-1,1),jet:!!d.jet,fire:!!d.fire,hasAim:!!d.hasAim,aimT:+d.aimT||0,aimK:clamp(+d.aimK||14,4,40),r:d.r|0,s:d.s|0,n:d.n|0}}
}
function remoteInp(e){
 const r=e.rin,i=neutralInp();i.aimT=e.aim;if(!r)return i;
 i.mx=r.mx;i.jet=r.jet;i.fire=r.fire;i.hasAim=r.hasAim;i.aimT=r.aimT;i.aimK=r.aimK;
 if(r.r!==e.proc.r){i.reload=true;e.proc.r=r.r}if(r.s!==e.proc.s){i.swap=true;e.proc.s=r.s}if(r.n!==e.proc.n){i.nade=true;e.proc.n=r.n}
 return i;
}

async function lanJoin(code){
 code=String(code||'').trim().toUpperCase();if(code.length<4){toastM('Enter the 4 letter code');return}
 if(NETM.busy)return;NETM.busy=true;
 try{
  const net=NETM.net||await openLan('militia');NETM.net=net;
  net.onmsg=clientMsg;net.onhostgone=()=>{toastM('The host left the match');lanLeave()};net.onclose=()=>{toastM('Network connection lost');lanLeave()};
  await net.joinRoom(code,S.name||'Rookie');
  NETM.role='client';NETM.code=code;NETM.label=net.label;NETM.view='lobby';NETM.lobby=null;
  net.send('host',{t:'hello',name:S.name||'Rookie',cfg:myCfg()});
 }catch(e){toastM(e.message||'Could not join');if(NETM.net&&!NETM.role){try{NETM.net.close()}catch(_){}NETM.net=null}}
 NETM.busy=false;syncUI();
}
function clientMsg(from,d){
 if(!d)return;
 switch(d.t){
  case'lobby':NETM.lobby=d;if(state==='menu'||state==='pmenu')renderTab();break;
  case'start':clientStart(d);break;
  case's':applySnap(d);break;
  case'over':if(P&&state!=='over'){d.list.forEach((a,i)=>{if(ents[i]){ents[i].kills=a[0];ents[i].deaths=a[1]}});endMatch()}break;
  case'stop':clearWorld();setState('menu');break;
  case'full':toastM('That match is full');lanLeave();break;
 }
}
function clientStart(d){
 audioInit();ents=[];bullets=[];nades=[];parts=[];rings=[];feed=[];flash=0;hitT=0;NETM.kl=d.kl;
 d.roster.forEach(r=>{const e=mkEnt(r.name,r.skin,false);e.guns=r.guns.map(g=>mkGun(g.id,g.skin,g.att));e.dead=false;ents.push(e)});
 P=ents[d.you];packs=PACKS_DEF.map(([x,y])=>({x,y:y-14,t:0}));matchT=Infinity;NETM.cr=NETM.cs=NETM.cn=0;NETM.lk='';
 setState('play');
}
function applySnap(m){
 if(!P||(state!=='play'&&state!=='paused'))return;
 matchT=m.mt>=0?m.mt:Infinity;
 m.e.forEach((a,i)=>{const e=ents[i];if(!e)return;
  const was=e.dead,first=e.tx===undefined&&e.px===undefined;
  e.hp=a[5];e.fuel=a[6];e.dead=!!a[7];e.inv=a[8];e.cur=a[9];e.onGround=!!a[11];e.nades=a[13];e.kills=a[14];e.deaths=a[15];e.respawn=a[16];
  if(e.guns[0]){e.guns[0].ammo=a[17];e.guns[0].rt=a[18]?e.guns[0].d.reload:0}if(e.guns[1]){e.guns[1].ammo=a[19];e.guns[1].rt=a[20]?e.guns[1].d.reload:0}
  if(e===P){P.sx=a[0];P.sy=a[1];P.svx=a[2];P.svy=a[3];e.px=1;
   if(first||(was&&!e.dead)||e.dead||Math.hypot(P.x-a[0],P.y-a[1])>160){P.x=a[0];P.y=a[1];P.vx=a[2];P.vy=a[3];if(!P.dead)P.aim=a[4]}}
  else{e.tx=a[0];e.ty=a[1];e.vx=a[2];e.vy=a[3];e.taim=a[4];e.jet=!!a[10];e.flashT=a[12]?.05:0;
   if(first||e.dead||(was&&!e.dead)||Math.hypot(e.x-a[0],e.y-a[1])>300){e.x=a[0];e.y=a[1];e.aim=a[4]}}});
 bullets=m.b.map(b=>({x:b[0],y:b[1],vx:b[2],vy:b[3],col:b[4],explosive:!!b[5]}));
 nades=m.g.map(g=>({x:g[0],y:g[1],vx:g[2],vy:g[3],t:g[4]}));
 m.p.forEach((f,i)=>{if(packs[i])packs[i].t=f?1:0});
 for(const ev of m.ev)applyEv(ev);
}
function applyEv(ev){
 const me=ents.indexOf(P);
 switch(ev[0]){
  case'sh':{const[,x,y,s,i]=ev;burst(x,y,3,'#ffd36a',160,.15,0,2);sfx(s,i===me?1:volAt(x,y)*.6);if(ents[i])ents[i].flashT=.05;if(i===me)vibrate(10);break}
  case'hu':{const e=ents[ev[1]];if(!e)break;burst(e.x,e.y-4,ev[2]?8:5,'#c0392b',180,.5,500,2.5);
   if(e===P){flash=.35;sfx('hurt',1);vibrate(40);cam.shake=Math.max(cam.shake,4)}else sfx('hit',volAt(e.x,e.y)*.5);
   if(ev[3]===me&&e!==P){hitT=.18;sfx('hit',.8)}break}
  case'ki':{const e=ents[ev[1]];if(!e)break;burst(e.x,e.y,22,'#c0392b',260,.9,600,3);burst(e.x,e.y,10,e.skin.suit,220,.9,600,3);
   if(e===P){P.killer=ents[ev[2]]||null;P.respawn=3}if(ev[2]===me&&e!==P)sfx('kill',1);break}
  case'ex':explodeFx(ev[1],ev[2],ev[3]);break;
  case'fd':feed.unshift({t:5,text:ev[1]});feed.length=Math.min(feed.length,4);break;
  case'pk':if(ev[1]===me)sfx('pickup',1);break;
 }
}
function predictMove(e,inp,dt){
 if(inp.hasAim)e.aim=wrap(e.aim+wrap(inp.aimT-e.aim)*(1-Math.exp(-inp.aimK*dt)));
 else if(Math.abs(inp.mx)>.3&&Math.sign(inp.mx)!==(Math.cos(e.aim)>=0?1:-1))e.aim=wrap(Math.PI-e.aim);
 const target=inp.mx*SPEED,acc=inp.mx!==0?(e.onGround?2600:1100):(e.onGround?2000:300);
 e.vx=approach(e.vx,target,acc*dt);e.jet=false;
 if(inp.jet&&e.fuel>0){e.vy-=2400*dt;e.fuel=Math.max(0,e.fuel-36*dt);e.jet=true;e.regen=.6;if(Math.random()<.5)parts.push({x:e.x-(Math.cos(e.aim)>=0?1:-1)*11,y:e.y+10,vx:rnd(-30,30),vy:rnd(80,160),life:.35,max:.35,col:'#aaa',grav:0,size:2.5})}
 else{e.regen-=dt;if(e.regen<=0)e.fuel=Math.min(100,e.fuel+(e.onGround?55:16)*dt)}
 e.vy=clamp(e.vy+GRAV*dt,-460,900);moveEntity(e,dt);
 if(e.onGround)e.phase+=Math.abs(e.vx)*dt*.09;
}
function clientFx(dt){
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
 for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>=rings[i].dur)rings.splice(i,1)}
 for(let i=feed.length-1;i>=0;i--){feed[i].t-=dt;if(feed[i].t<=0)feed.splice(i,1)}
 flash=Math.max(0,flash-dt);hitT=Math.max(0,hitT-dt);cam.shake=Math.max(0,cam.shake-dt*20);
 if(parts.length>600)parts.splice(0,parts.length-600);
}
function clientUpdate(dt){
 time+=dt;
 const inp=state==='paused'?neutralInp():readInput();
 if(inp.reload)NETM.cr++;if(inp.swap)NETM.cs++;if(inp.nade)NETM.cn++;
 NETM.it+=dt;
 const key=[inp.mx.toFixed(2),inp.jet|0,inp.fire|0,inp.aimT.toFixed(2),NETM.cr,NETM.cs,NETM.cn].join();
 if((key!==NETM.lk&&NETM.it>.03)||NETM.it>.1){NETM.it=0;NETM.lk=key;netSend('host',{t:'in',mx:+inp.mx.toFixed(2),jet:inp.jet,fire:inp.fire,hasAim:inp.hasAim,aimT:+inp.aimT.toFixed(3),aimK:inp.aimK,r:NETM.cr,s:NETM.cs,n:NETM.cn})}
 const k=1-Math.exp(-dt*18);
 for(const e of ents){if(e===P||e.dead||e.tx===undefined)continue;
  e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;e.tx+=e.vx*dt;e.ty+=e.vy*dt;
  if(e.taim!==undefined)e.aim=wrap(e.aim+wrap(e.taim-e.aim)*(1-Math.exp(-dt*20)));
  if(e.onGround)e.phase+=Math.abs(e.vx)*dt*.09;e.flashT=Math.max(0,e.flashT-dt)}
 if(P&&!P.dead&&P.sx!==undefined){
  predictMove(P,inp,dt);P.flashT=Math.max(0,P.flashT-dt);
  const moving=Math.abs(inp.mx)>.1||inp.jet,err=Math.hypot(P.sx-P.x,P.sy-P.y);
  if(err>160){P.x=P.sx;P.y=P.sy;P.vx=P.svx;P.vy=P.svy}
  else{const kk=1-Math.exp(-dt*(moving?.5:7));P.x+=(P.sx-P.x)*kk;P.y+=(P.sy-P.y)*kk;P.vx+=(P.svx-P.vx)*kk;P.vy+=(P.svy-P.vy)*kk}
 }
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}
 for(const g of nades){g.x+=g.vx*dt;g.y+=g.vy*dt;g.vy+=900*dt;g.t-=dt}
 clientFx(dt);updCamera(dt);
}
function lanLeave(){
 if(NETM.net){try{if(NETM.role==='host')netSend('*',{t:'stop'})}catch(_){}try{NETM.net.close()}catch(_){}}
 const wasClient=NETM.role==='client';
 for(const e of ents)if(e.remote)e.remote=false;
 NETM.net=null;NETM.role='';NETM.code='';NETM.peers=new Map();NETM.lobby=null;NETM.view='home';
 if(wasClient&&P&&matchOn()){clearWorld();setState('menu')}
 K.refresh();syncUI();if(state==='menu'||state==='pmenu')renderTab();
}
async function lanRooms(){try{if(!NETM.net)NETM.net=await openLan('militia');NETM.rooms=await NETM.net.listRooms()}catch(e){NETM.rooms=[];toastM(e.message)}renderTab()}
function leaveMatchUi(){
 if(NETM.role==='host')netSend('*',{t:'stop'});
 clearWorld();setState('menu');if(NETM.role==='host')lobbyBroadcast();
}
function lanHtml(){
 const tr=NETM.net&&NETM.label?`<p class="mute">Connection: <b>${esc(NETM.label)}</b>${NETM.net instanceof BCNet?'. Open this page in a second tab, or run <b>node server.js</b> and open the printed address on other devices.':'.'}</p>`:'';
 const rows=l=>`<div class="chips" style="margin:8px 0">${l.map(p=>`<span class="chip on"><i style="background:${p.host?'#f0b429':'#7bc47f'}"></i>${esc(p.name)}${p.host?' (host)':''}</span>`).join('')}</div>`;
 if(NETM.role==='host'){const l=NETM.lobby?NETM.lobby.list:[{name:S.name||'Rookie',host:true}];
  return`<h3>Hosting a LAN match</h3><p>Friends open this game, go to the LAN tab and press Join with this code:</p><p class="big" style="font:400 54px Impact,sans-serif;letter-spacing:.2em;color:var(--amber);text-align:center">${esc(NETM.code)}</p>${tr}<h3>Players (${l.length})</h3>${rows(l)}<p class="mute">Bots fill the rest (${S.match.bots} from the Match tab, up to 8 fighters). Press <b>Deploy</b> to start for everyone.</p><div class="seg" style="justify-content:flex-start"><button id="lanStop">Stop hosting</button></div>`}
 if(NETM.role==='client'){const l=NETM.lobby?NETM.lobby.list:[];
  return`<h3>Connected to ${esc(NETM.code)}</h3>${tr}${rows(l)}<p>${NETM.lobby&&NETM.lobby.inGame?'A match is running. You will join the next one.':'Waiting for the host to deploy…'}</p><div class="seg" style="justify-content:flex-start"><button id="lanLeave">Leave</button></div>`}
 if(NETM.view==='join'){
  return`<h3>Join a LAN match</h3><div class="row"><input id="lanCode" type="text" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" value="${esc(NETM.codeIn)}" style="width:120px;text-transform:uppercase;letter-spacing:.3em;text-align:center;padding:10px;border-radius:6px;border:1px solid var(--line);background:#0e1412;color:var(--khaki);font:800 18px inherit"><div class="seg"><button id="lanGo">Join</button></div></div>
  <h3>Open matches</h3>${NETM.rooms.length?NETM.rooms.map(r=>`<div class="row"><span>${esc(r.name||'Host')} (${esc(r.code)})<small>${r.inGame?'in progress':'waiting in lobby'}</small></span><div class="seg"><button data-room="${esc(r.code)}">Join</button></div></div>`).join(''):'<p class="mute">No open matches found. Ask the host for the code.</p>'}
  <div class="seg" style="justify-content:flex-start;margin-top:10px"><button id="lanRef">Refresh</button><button id="lanBack">Back</button></div>`}
 return`<h3>Play with friends</h3><p>Host a deathmatch on this device, or join a friend's. Run <b>node server.js</b> to play across phones and computers on the same Wi-Fi. Without the server, tabs of the same browser can play each other.</p><div class="seg" style="justify-content:flex-start;margin-top:10px"><button id="lanHost">Host a match</button><button id="lanJoinV">Join a match</button></div>`;
}
$('#tabBody').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='lanHost')lanHost();else if(b.id==='lanJoinV'){NETM.view='join';renderTab();lanRooms()}
 else if(b.id==='lanBack'){if(NETM.net&&!NETM.role){try{NETM.net.close()}catch(_){}NETM.net=null}NETM.view='home';renderTab()}
 else if(b.id==='lanRef')lanRooms();else if(b.id==='lanGo')lanJoin($('#lanCode').value);
 else if(b.id==='lanStop'||b.id==='lanLeave')lanLeave();else if(b.dataset.room)lanJoin(b.dataset.room);
});
$('#tabBody').addEventListener('input',e=>{if(e.target.id==='lanCode')NETM.codeIn=e.target.value.toUpperCase()});

/* ----- cheats ----- */
const hostish=()=>NETM.role!=='client';
function giveGun(id){if(!P||P.dead)return;const slot=P.cur;P.guns[slot]=mkGun(id,S.wskin[slot?'secondary':'primary'],S.att[slot?'secondary':'primary'])}
function applyCheatsPre(inp){if(P&&!P.dead){const sp=K.get('spd')||1;if(sp>1)inp.mx*=sp}}
function applyCheatsPost(){
 if(!P||P.dead)return;
 if(K.on('god'))P.hp=100;if(K.on('fuel'))P.fuel=100;if(K.on('nades'))P.nades=Math.max(P.nades,3);
 const g=P.guns[P.cur];if(g){if(K.on('ammo')){g.ammo=g.mag;g.rt=0}if(K.on('rapid'))g.cd=0}
}
function drawRadar(){
 if(!P||P.dead||!K.on('radar'))return;
 const{sc}=view(),cx=VW/2,cy=VH/2,mx=VW/2-24,my=VH/2-24;
 for(const e of ents){if(e===P||e.dead)continue;
  const sx=(e.x-cam.x)*sc,sy=(e.y-cam.y)*sc;if(sx>10&&sx<VW-10&&sy>10&&sy<VH-10)continue;
  const dx=sx-cx,dy=sy-cy,k=Math.min(mx/Math.abs(dx||1),my/Math.abs(dy||1)),x=cx+dx*k,y=cy+dy*k,a=Math.atan2(dy,dx);
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#ff4a3a';ctx.globalAlpha=.85;ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-7,-7);ctx.lineTo(-7,7);ctx.closePath();ctx.fill();ctx.restore()}
 ctx.globalAlpha=1;
}
K.cheats({
 note:()=>NETM.role==='client'?'Joined a friend\'s match: only the radar works here.':'Cheats affect your fighter.',
 quick:['god','fuel','ammo'],
 groups:[
  {title:'Survival',show:hostish,items:[
   {id:'god',short:'God',type:'toggle',label:'God mode'},
   {id:'fuel',short:'Fuel',type:'toggle',label:'Infinite jetpack fuel'},
   {id:'ammo',short:'Ammo',type:'toggle',label:'Infinite ammo'},
   {id:'nades',type:'toggle',label:'Infinite grenades'},
   {type:'buttons',items:[{label:'Heal + fuel',run:()=>{if(P){P.hp=100;P.fuel=100}}},{label:'Respawn now',run:()=>{if(P&&P.dead)P.respawn=0}}]}]},
  {title:'Weapons',show:hostish,items:[
   {id:'rapid',type:'toggle',label:'Rapid fire'},
   {id:'dmg',type:'range',label:'Damage multiplier',min:1,max:10,step:1,def:1,fmt:v=>v+'×'},
   {type:'buttons',items:['sniper','rocket','shotgun','rifle'].map(id=>({label:WEAPONS[id].name,run:()=>giveGun(id)}))}]},
  {title:'Movement',show:hostish,items:[
   {id:'spd',type:'range',label:'Run speed',min:1,max:3,step:.25,def:1,fmt:v=>(+v).toFixed(2)+'×'},
   {type:'buttons',items:[{label:'To top deck',run:()=>{if(P&&!P.dead){P.x=1800;P.y=340;P.vx=P.vy=0}}},{label:'To centre',run:()=>{if(P&&!P.dead){P.x=1800;P.y=1150;P.vx=P.vy=0}}}]}]},
  {title:'Match',show:hostish,items:[
   {id:'freeze',type:'toggle',label:'Freeze bots'},
   {type:'buttons',items:[
    {label:'Eliminate bots',run:()=>{for(const e of ents)if(e!==P&&!e.dead&&!e.remote){e.inv=0;hurt(e,999,P,'Cheat')}}},
    {label:'+5 kills',run:()=>{if(P){P.kills+=5;if(P.kills>=S.match.kills&&state==='play')endMatch()}}},
    {label:'Win match',run:()=>{if(P&&matchOn()){P.kills=Math.max(P.kills,S.match.kills);endMatch()}}}]}]},
  {title:'View',items:[{id:'radar',short:'Radar',type:'toggle',label:'Enemy radar arrows'}]}
 ]});
GameKit.init({id:'militia',title:'Jet Militia',accent:'#f0b429',fsPos:{top:'10px',right:'60px'},ignore:'.ctl'});
if(window.__TESTING)window.__mm={get ents(){return ents},get P(){return P},NETM,newMatch,get state(){return state},S};

/* ============ boot ============ */
resize();
renderTab();
syncUI();
requestAnimationFrame(frame);

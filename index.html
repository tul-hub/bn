<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OmniGame Room - Real-Time Multiplayer Games</title>
    <meta name="description" content="A real-time multiplayer gaming hub powered by a Node.js WebSocket server. Play 14 action, board, and arcade games with friends over local Wi-Fi or online." />
    <meta name="theme-color" content="#060810" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- OpenGraph / Social -->
    <meta property="og:title" content="OmniGame Room - Real-Time Multiplayer Games" />
    <meta property="og:description" content="A real-time multiplayer gaming hub powered by a Node.js WebSocket server. Play 14 action, board, and arcade games with friends over local Wi-Fi or online." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='6' width='20' height='12' rx='4'/%3E%3Cpath d='M6 12h4m-2-2v4m8-2h.01m3-2h.01'/%3E%3C/svg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: #060810;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      /* Pre-render Fancy Splash */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #0f172a 0%, #060810 80%);
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .loader-icon {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(16, 185, 129, 0.35);
        animation: pulse-glow 2s infinite ease-in-out;
      }
      .loader-icon svg {
        width: 34px;
        height: 34px;
        fill: none;
        stroke: #04141a;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .loader-title {
        margin-top: 20px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.02em;
        background: linear-gradient(to right, #ffffff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .loader-sub {
        margin-top: 6px;
        font-size: 13px;
        color: #64748b;
        font-weight: 500;
      }
      .loader-progress {
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
        margin-top: 18px;
        position: relative;
      }
      .loader-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        background: linear-gradient(90deg, #10b981, #06b6d4);
        border-radius: 99px;
        animation: loading-slide 1.2s infinite ease-in-out;
      }
      @keyframes pulse-glow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }
        50% { transform: scale(1.04); box-shadow: 0 0 50px rgba(6, 182, 212, 0.45); }
      }
      @keyframes loading-slide {
        0% { left: -40%; width: 40%; }
        50% { width: 60%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-icon">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="6" width="20" height="12" rx="4" />
            <path d="M6 12h4m-2-2v4m8-2h.01m3-2h.01" />
          </svg>
        </div>
        <div class="loader-title">OmniGame Room</div>
        <div class="loader-sub">Initializing Real-Time Node.js Engine</div>
        <div class="loader-progress">
          <div class="loader-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
